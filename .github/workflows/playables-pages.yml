name: Publish Playables candidate to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract candidate
        run: |
          rm -rf public
          mkdir public
          unzip -q SNAKE_3310_GENZ_PLAYABLES_FINAL_CANDIDATE.zip -d public
          test -f public/index.html
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("public/index.html")
          s = p.read_text(encoding="utf-8")
          m = re.search(r"<script>(.*?)</script>", s, re.S)
          if not m:
              raise SystemExit("No game script found")
          Path("/tmp/game.js").write_text(m.group(1), encoding="utf-8")
          PY
          node --check /tmp/game.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
