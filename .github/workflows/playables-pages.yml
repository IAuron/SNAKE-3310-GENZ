name: Publish Playables candidate to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract candidate
        run: |
          rm -rf public
          mkdir public
          unzip -q SNAKE_3310_GENZ_PLAYABLES_FINAL_CANDIDATE.zip -d public
          test -f public/index.html
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path("public/index.html")
          s = p.read_text(encoding="utf-8")

          old_resize = "function resize(){let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);G.cell=Math.max(22,Math.floor(Math.min(r.width,r.height)/18));G.grid=Math.floor(Math.min(r.width,r.height)/G.cell)}"
          new_resize = "function resize(){const arena=document.querySelector('.arena');let r=(arena&&arena.getBoundingClientRect().width>0)?arena.getBoundingClientRect():c.getBoundingClientRect(),d=devicePixelRatio||1;let w=Math.max(1,r.width),h=Math.max(1,r.height);c.width=w*d;c.height=h*d;ctx.setTransform(d,0,0,d,0,0);G.cell=Math.max(22,Math.floor(Math.min(w,h)/18));G.grid=Math.max(12,Math.floor(Math.min(w,h)/G.cell))}"
          old_start = "function startGame(){closeModal('gameover');closeModal('boss');show('game');resize();let n=G.grid;G.snake=[{x:Math.floor(n/2),y:Math.floor(n/2)},{x:Math.floor(n/2)-1,y:Math.floor(n/2)}];G.dir={x:1,y:0};G.next={x:1,y:0};G.score=0;G.combo=0;G.foodCount=0;G.boost=0;G.particles=[];G.paused=false;G.tick=0;spawnFood();G.running=true;G.last=performance.now();document.getElementById('worldBadge').textContent='🌿 GREEN VALLEY';requestAnimationFrame(loop)}"
          new_start = "function startGame(){closeModal('gameover');closeModal('boss');show('game');requestAnimationFrame(()=>{resize();let n=Math.max(12,G.grid);G.grid=n;G.snake=[{x:Math.floor(n/2),y:Math.floor(n/2)},{x:Math.floor(n/2)-1,y:Math.floor(n/2)}];G.dir={x:1,y:0};G.next={x:1,y:0};G.score=0;G.combo=0;G.foodCount=0;G.boost=0;G.particles=[];G.paused=false;G.tick=0;spawnFood();G.running=true;G.last=performance.now();document.getElementById('worldBadge').textContent='🌿 GREEN VALLEY';requestAnimationFrame(loop)})}"

          if old_resize not in s:
              raise SystemExit("Expected resize block not found")
          if old_start not in s:
              raise SystemExit("Expected startGame block not found")

          s = s.replace(old_resize, new_resize, 1)
          s = s.replace(old_start, new_start, 1)

          old_step = " G.dir=G.next;let h={x:G.snake[0].x+G.dir.x,y:G.snake[0].y+G.dir.y},n=G.grid;\n if(h.x<0||h.y<0||h.x>=n||h.y>=n||G.snake.some(s=>s.x==h.x&&s.y==h.y)){return endGame()}"
          new_step = " G.dir=G.next;let h={x:G.snake[0].x+G.dir.x,y:G.snake[0].y+G.dir.y},n=G.grid;\n h.x=(h.x+n)%n;h.y=(h.y+n)%n;\n let ateNow=h.x==G.food.x&&h.y==G.food.y;let bodyToCheck=ateNow?G.snake:G.snake.slice(0,-1);\n if(bodyToCheck.some(s=>s.x==h.x&&s.y==h.y)){return endGame('Tu as touché ton corps 🐍')}"
          if old_step not in s:
              raise SystemExit("Expected step collision block not found")
          s = s.replace(old_step, new_step, 1)
          s = s.replace("let interval=Math.max(48,115-data.up.speed*7-(G.boost?28:0));",
                        "let interval=Math.max(70,155-data.up.speed*7-(G.boost?28:0));", 1)

          s = s.replace("function endGame(){G.running=false;try{PlayablesAdapter.score()}catch(e){};document.getElementById('finalScore').textContent=G.score;document.getElementById('finalInfo').textContent=\`${currentForm().name} · ${G.foodCount} fruits · combo max ${Math.floor(data.stats.maxCombo)} · +${G.foodCount*3} coins environ\`;document.getElementById('gameover').classList.add('show');save()}",
                        "function endGame(reason){G.running=false;try{PlayablesAdapter.score()}catch(e){};document.getElementById('finalScore').textContent=G.score;document.getElementById('finalInfo').textContent=(reason?reason+' · ':'')+\`${currentForm().name} · ${G.foodCount} fruits · combo max ${Math.floor(data.stats.maxCombo)} · +${G.foodCount*3} coins environ\`;document.getElementById('gameover').classList.add('show');save()}", 1)

          s = s.replace("let anim=G.boost?'BOOST':(G.bite?'BITE':(G.tick%70<9?'BLINK':'IDLE'));",
                        "let anim='IDLE';", 1)

          # Remove the animation debug badge from the final UI.
          s = s.replace(/<div[^>]*id=["']animBadge["'][^>]*>.*?<\\/div>/s, "");
          s = s.replace(/document\\.getElementById\\(['"]animBadge['"]\\)\\.textContent=anim;/g, "");
          s = s.replace("Math.sin(G.tick*.22+i*.65)",
                        "Math.sin(G.tick*.04+i*.65)", 1)
          s = s.replace("G.tick%70>=4&&G.tick%70<=8",
                        "Math.floor(animT/160)%24===0", 1)
          s = s.replace("G.tick%18<9",
                        "Math.floor(animT/180)%2===0", 1)

          p.write_text(s, encoding="utf-8")

          m = re.search(r"<script>(.*?)</script>", s, re.S)
          if not m:
              raise SystemExit("No game script found after patch")
          Path("/tmp/game.js").write_text(m.group(1), encoding="utf-8")
          PY
          node --check /tmp/game.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
