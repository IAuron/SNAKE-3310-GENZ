name: Publish Playables candidate to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract candidate
        run: |
          rm -rf public
          mkdir public
          unzip -q SNAKE_3310_GENZ_PLAYABLES_FINAL_CANDIDATE.zip -d public
          python - <<'PY'
          from pathlib import Path
          p = Path("public/index.html")
          s = p.read_text(encoding="utf-8")
          bad = "  ctx.restore();\n  ctx.restore();\n  ctx.restore();\n}\n\nfunction bossHit()"
          good = "  ctx.restore();\n}\n\nfunction bossHit()"
          if bad not in s:
              raise SystemExit("Expected duplicate ctx.restore() block was not found")
          p.write_text(s.replace(bad, good, 1), encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
